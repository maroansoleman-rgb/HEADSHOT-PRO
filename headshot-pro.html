<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Headshot PRO</title>
<style>
:root{--bg:#0a0a0c;--card:#16161a;--line:#2a2a30;--red:#e11d2e;--txt:#fff;--mut:#9a9aa5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,system-ui,sans-serif;max-width:560px;margin:auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:1px}
.logo b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:15px;color:var(--red);letter-spacing:.5px}
button,select{font:inherit;border-radius:10px;border:1px solid var(--line);background:#222;color:#fff;padding:12px;width:100%}
button.p{background:linear-gradient(135deg,#e11d2e,#8f0f1b);border:0;font-weight:700;margin-bottom:8px}
button.s{width:auto;padding:6px 12px;font-size:13px}
.row{display:flex;gap:8px}
.row>*{flex:1}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
dt{color:var(--mut)}dd{margin:0;text-align:end;direction:ltr;unicode-bidi:plaintext}
.sl{margin:12px 0}
.sl div{display:flex;justify-content:space-between;font-size:14px}
.sl span:last-child{color:var(--red);font-weight:700}
input[type=range]{width:100%;accent-color:var(--red)}
ul,ol{margin:0;padding-inline-start:20px;font-size:14px;line-height:1.8;color:#ddd}
.note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{width:auto;white-space:nowrap;padding:9px 14px;font-size:13px}
.tabs button.on{background:var(--red);border-color:var(--red)}
.hide{display:none}
.credit{text-align:center;margin:26px 0 10px;padding:14px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.credit b{display:block;margin-top:4px;color:var(--red);font-size:16px;letter-spacing:2px;direction:ltr}
.saved{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
</style>
</head>
<body>
<header>
 <div class="logo"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#e11d2e" stroke-width="2.5"><circle cx="17" cy="17" r="10"/><path d="M17 2v8M17 24v8M2 17h8M24 17h8"/><circle cx="17" cy="17" r="2" fill="#e11d2e"/></svg><span>HEADSHOT <b>PRO</b></span></div>
 <button class="s" id="lang">EN</button>
</header>

<div class="tabs" id="tabs"></div>

<section id="p-home">
 <div class="card">
  <button class="p" id="scan"></button>
  <button class="p" id="calc"></button>
  <div class="note" id="scanNote"></div>
 </div>
 <div class="card"><h2 id="t-phone"></h2><dl id="info"></dl>
  <div style="margin-top:12px"><h2 id="t-manual"></h2>
  <div class="row"><select id="brand"></select><select id="model"></select></div></div>
 </div>
</section>

<section id="p-sens" class="hide">
 <div class="card"><h2 id="t-sens"></h2><div id="sliders"></div>
  <div class="row"><button id="copy"></button><button id="save"></button></div>
  <div class="row" style="margin-top:8px"><button id="reset"></button></div>
  <div class="note" id="sensNote"></div>
 </div>
 <div class="card"><h2 id="t-saved"></h2><div id="savedList"></div></div>
</section>

<section id="p-head" class="hide">
 <div class="card"><h2>HEADSHOT SETTINGS</h2>
  <div id="hsSliders"></div>
  <h2 id="t-tips" style="margin-top:14px"></h2><ul id="tips"></ul>
 </div>
</section>

<section id="p-db" class="hide">
 <div class="card"><h2 id="t-db"></h2><div id="dbList" class="note"></div>
  <div class="row" style="margin-top:10px"><input id="nb" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:#222;color:#fff"><input id="nm" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:#222;color:#fff"></div>
  <div class="row" style="margin-top:8px"><select id="nh"><option>60</option><option>90</option><option>120</option><option>144</option></select><select id="nt"></select></div>
  <button class="p" id="addDev" style="margin-top:8px"></button></div>
</section>

<section id="p-guide" class="hide">
 <div class="card"><h2 id="t-guide"></h2><ol id="guide"></ol></div>
</section>

<div class="credit"><span id="creditTxt">تمت البرمجة بواسطة</span><b>MAJEDSOLEMAN</b></div>

<script>
const L={
ar:{dir:'rtl',tabs:['الرئيسية','الحساسية','HEADSHOT','الأجهزة','تعليمات'],scan:'🔍 افحص هاتفي',calc:'🎯 استخراج الحساسية المناسبة',
scanNote:'المتصفح لا يكشف كل التفاصيل بدقة (الموديل قد يكون مخفياً). صحّح الموديل يدوياً من القوائم أدناه للحصول على أفضل اقتراح.',
phone:'إعدادات الهاتف',manual:'اختيار الهاتف يدوياً',sens:'الحساسية المقترحة',saved:'الإعدادات المحفوظة',
keys:['الحساسية العامة','Red Dot','سكوب 2X','سكوب 4X','سكوب القنص','النظر الحر'],fire:'حجم زر الإطلاق',
copy:'📋 نسخ',save:'💾 حفظ لهذا الهاتف',reset:'↺ إعادة الضبط',
note:'هذه قيم مبدئية مبنية على تقدير (فئة الجهاز + معدل التحديث + حجم الشاشة)، وليست نتيجة فحص علمي ولا تضمن نتيجة. جرّبها في التدريب وعدّلها حسب إحساسك.',
info:['الشركة','الموديل','أندرويد/النظام','الدقة','الحجم التقريبي','معدل التحديث','DPI'],unk:'غير معروف',inch:'بوصة',
tips:'نصائح التحكم بالتصويب',copied:'تم النسخ ✓',savedOk:'تم الحفظ ✓',del:'حذف',load:'فتح',empty:'لا توجد إعدادات محفوظة',
db:'قاعدة الأجهزة (قابلة للتحديث)',addDev:'+ إضافة جهاز',tier:['ضعيف','متوسط','قوي'],bph:'الشركة',mph:'الموديل',other:'أخرى',
hs:['سحب الهيدشوت','حساسية الإطلاق'],
tipsL:['ابدأ بحساسية أقل قليلاً ثم ارفعها 3–5 درجات حتى يصبح السحب مريحاً.','ثبّت إبهامك وحرّك بحركات قصيرة بدل السحب الطويل.','اجعل زر الإطلاق بحجم يسمح لك بالضغط دون تغطية الشاشة.','جرّب كل تعديل 10 دقائق في غرفة التدريب قبل الحكم عليه.','خفّض الحساسية عند السكوبات الكبيرة لثبات أكثر.','نظّف الشاشة واستخدم يداً جافة لتحسين الاستجابة.'],
guideL:['اضغط «افحص هاتفي» أو اختر هاتفك يدوياً.','اضغط «استخراج الحساسية المناسبة».','افتح اللعبة ← الإعدادات ← الحساسية وأدخل القيم يدوياً.','جرّب في غرفة التدريب وعدّل الأرقام بفارق 3–5 درجات.','احفظ الإعدادات الناجحة لهاتفك.','التطبيق مستقل ولا يعدّل أي ملف من اللعبة.']},
en:{dir:'ltr',tabs:['Home','Sensitivity','HEADSHOT','Devices','Guide'],scan:'🔍 Scan my phone',calc:'🎯 Get suggested sensitivity',
scanNote:'Browsers cannot read every detail (model may be hidden). Correct the model manually below for the best suggestion.',
phone:'Phone info',manual:'Choose phone manually',sens:'Suggested sensitivity',saved:'Saved settings',
keys:['General','Red Dot','2X Scope','4X Scope','Sniper Scope','Free Look'],fire:'Fire button size',
copy:'📋 Copy',save:'💾 Save for this phone',reset:'↺ Reset',
note:'These are starting values based on an estimate (device tier + refresh rate + screen size), not a scientific test, and no result is guaranteed. Try them in training and tune to your feel.',
info:['Manufacturer','Model','Android/OS','Resolution','Approx. size','Refresh rate','DPI'],unk:'Unknown',inch:'in',
tips:'Aiming tips',copied:'Copied ✓',savedOk:'Saved ✓',del:'Delete',load:'Open',empty:'Nothing saved yet',
db:'Device database (updatable)',addDev:'+ Add device',tier:['Low','Mid','High'],bph:'Brand',mph:'Model',other:'Other',
hs:['Headshot drag','Fire sensitivity'],
tipsL:['Start slightly lower, then raise 3–5 points until dragging feels comfortable.','Anchor your thumb and use short flicks instead of long drags.','Size the fire button so you can tap without covering the view.','Test each change for 10 minutes in the training room.','Lower sensitivity on high-zoom scopes for steadier aim.','Keep the screen clean and your hands dry for better touch response.'],
guideL:['Tap “Scan my phone” or pick your phone manually.','Tap “Get suggested sensitivity”.','Open the game → Settings → Sensitivity and enter the values by hand.','Test in the training room and adjust by 3–5 points.','Save the settings that work for your phone.','This app is standalone and never modifies any game file.']}
};
const TIER=[0,1,2];
const DEFAULT_DB={Samsung:[['Galaxy A04',60,0],['Galaxy A14',90,0],['Galaxy A34',120,1],['Galaxy S21',120,2],['Galaxy S23',120,2]],
Xiaomi:[['Poco X5',120,1],['Poco F5',120,2],['Mi 11',120,2]],Redmi:[['Redmi 9A',60,0],['Redmi Note 11',90,1],['Redmi Note 12',120,1]],
Infinix:[['Hot 11',90,0],['Note 12',90,1],['Zero 30',144,2]],Tecno:[['Spark 8',60,0],['Camon 19',90,1],['Phantom X',90,2]],
OPPO:[['A57',90,0],['Reno 8',90,1],['Find X5',120,2]],Vivo:[['Y21',60,0],['V25',90,1],['X80',120,2]],
Realme:[['C21',60,0],['Realme 9',90,1],['GT Neo 3',120,2]],iPhone:[['iPhone 11',60,1],['iPhone 12',60,2],['iPhone 13',60,2],['iPhone 14 Pro',120,2],['iPhone 15 Pro',120,2]]};
const S=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let lang=S('hs_lang','ar'),db=S('hs_db',DEFAULT_DB),dev=S('hs_dev',{brand:'Samsung',model:'Galaxy A14',hz:90,tier:0,w:0,h:0,dpr:1,os:'',size:0}),vals=null,tab=0;
const $=i=>document.getElementById(i),t=()=>L[lang];
function suggest(d){
 let g=d.tier===0?92:d.tier===1?88:84;
 if(d.hz>=120)g-=4;else if(d.hz>=90)g-=2;
 if(d.size>=6.7)g+=2;else if(d.size&&d.size<5.8)g-=2;
 g=Math.max(20,Math.min(100,g));
 return [g,g-6,g-10,g-16,g-24,Math.max(20,g-12),d.tier===0?55:d.tier===1?50:46].map(x=>Math.max(5,Math.min(100,x)));
}
function render(){
 const T=t();document.documentElement.lang=lang;document.documentElement.dir=T.dir;
 $('lang').textContent=lang==='ar'?'EN':'ع';
 $('creditTxt').textContent=lang==='ar'?'تمت البرمجة بواسطة':'Developed by';
 $('tabs').innerHTML=T.tabs.map((x,i)=>`<button class="${i===tab?'on':''}" data-t="${i}">${x}</button>`).join('');
 ['home','sens','head','db','guide'].forEach((n,i)=>$('p-'+n).classList.toggle('hide',i!==tab));
 $('scan').textContent=T.scan;$('calc').textContent=T.calc;$('scanNote').textContent=T.scanNote;
 $('t-phone').textContent=T.phone;$('t-manual').textContent=T.manual;$('t-sens').textContent=T.sens;$('t-saved').textContent=T.saved;
 $('copy').textContent=T.copy;$('save').textContent=T.save;$('reset').textContent=T.reset;$('sensNote').textContent=T.note;
 $('t-tips').textContent=T.tips;$('tips').innerHTML=T.tipsL.map(x=>`<li>${x}</li>`).join('');
 $('t-guide').textContent=T.tabs[4];$('guide').innerHTML=T.guideL.map(x=>`<li>${x}</li>`).join('');
 $('t-db').textContent=T.db;$('addDev').textContent=T.addDev;$('nb').placeholder=T.bph;$('nm').placeholder=T.mph;
 $('nt').innerHTML=T.tier.map((x,i)=>`<option value="${i}">${x}</option>`).join('');
 const v=[dev.brand||T.unk,dev.model||T.unk,dev.os||T.unk,dev.w?`${dev.w}×${dev.h}`:T.unk,dev.size?`~${dev.size.toFixed(1)} ${T.inch}`:T.unk,dev.hz?dev.hz+' Hz':T.unk,dev.dpr?Math.round(dev.dpr*160):T.unk];
 $('info').innerHTML=T.info.map((k,i)=>`<dt>${k}</dt><dd>${v[i]}</dd>`).join('');
 const bs=Object.keys(db);if(!bs.includes(dev.brand))bs.push(dev.brand);
 $('brand').innerHTML=bs.map(b=>`<option ${b===dev.brand?'selected':''}>${b}</option>`).join('');
 fillModels();
 $('dbList').innerHTML=Object.entries(db).map(([b,m])=>`<b>${b}</b>: ${m.map(x=>x[0]+' ('+x[1]+'Hz)').join(', ')}`).join('<br>');
 sliders();savedList();
}
function fillModels(){
 const ms=db[dev.brand]||[];
 $('model').innerHTML=`<option value="">—</option>`+ms.map(m=>`<option ${m[0]===dev.model?'selected':''}>${m[0]}</option>`).join('');
}
function sliders(){
 const T=t();if(!vals)vals=S('hs_v_'+dev.brand+dev.model,null)||suggest(dev);
 const row=(i,label)=>`<div class="sl"><div><span>${label}</span><span id="v${i}">${vals[i]}</span></div><input type="range" min="0" max="100" value="${vals[i]}" data-i="${i}"></div>`;
 $('sliders').innerHTML=T.keys.map((k,i)=>row(i,k)).join('')+row(6,T.fire);
 $('hsSliders').innerHTML=row(0,T.hs[0]).replace(/data-i="0"/,'data-i="0"').replace('id="v0"','id="h0"')+row(6,T.fire).replace('id="v6"','id="h6"');
}
function savedList(){
 const all=S('hs_saved',[]),T=t();
 $('savedList').innerHTML=all.length?all.map((s,i)=>`<div class="saved"><span>${s.name}<br><small style="color:var(--mut)">${s.vals.join(' / ')}</small></span><span><button class="s" data-o="${i}">${T.load}</button> <button class="s" data-d="${i}">${T.del}</button></span></div>`).join(''):`<div class="note">${T.empty}</div>`;
}
document.addEventListener('input',e=>{
 const i=e.target.dataset&&e.target.dataset.i;if(i===undefined||e.target.type!=='range')return;
 vals[+i]=+e.target.value;document.querySelectorAll(`[data-i="${i}"]`).forEach(r=>r.value=vals[i]);
 ['v','h'].forEach(p=>{const el=$(p+i);if(el)el.textContent=vals[i]});
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t!==undefined){tab=+b.dataset.t;render()}
 if(b.dataset.d!==undefined){const a=S('hs_saved',[]);a.splice(+b.dataset.d,1);W('hs_saved',a);savedList()}
 if(b.dataset.o!==undefined){vals=S('hs_saved',[])[+b.dataset.o].vals.slice();tab=1;render()}
});
$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';W('hs_lang',lang);render()};
$('brand').onchange=e=>{dev.brand=e.target.value;dev.model='';fillModels()};
$('model').onchange=e=>{const m=(db[dev.brand]||[]).find(x=>x[0]===e.target.value);if(m){dev.model=m[0];dev.hz=m[1];dev.tier=m[2];W('hs_dev',dev);vals=null;render()}};
$('calc').onclick=()=>{vals=suggest(dev);W('hs_dev',dev);tab=1;render()};
$('reset').onclick=()=>{vals=suggest(dev);render()};
$('save').onclick=()=>{const a=S('hs_saved',[]),n=(dev.brand||'')+' '+(dev.model||'');const k=a.findIndex(x=>x.name===n);const o={name:n,vals:vals.slice()};k>=0?a[k]=o:a.push(o);W('hs_saved',a);W('hs_v_'+dev.brand+dev.model,vals);savedList();$('save').textContent=t().savedOk;setTimeout(()=>$('save').textContent=t().save,1200)};
$('copy').onclick=async()=>{
 const T=t(),txt=`Headshot PRO — ${dev.brand} ${dev.model} (${dev.hz}Hz)\n`+T.keys.map((k,i)=>`${k}: ${vals[i]}`).join('\n')+`\n${T.fire}: ${vals[6]}`;
 try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 $('copy').textContent=T.copied;setTimeout(()=>$('copy').textContent=T.copy,1200)};
$('addDev').onclick=()=>{
 const b=$('nb').value.trim(),m=$('nm').value.trim();if(!b||!m)return;
 (db[b]=db[b]||[]).push([m,+$('nh').value,+$('nt').value]);W('hs_db',db);$('nb').value=$('nm').value='';render()};
function measureHz(){return new Promise(res=>{let n=0,s=0;const f=ts=>{if(!s)s=ts;n++;ts-s<700?requestAnimationFrame(f):res(n/((ts-s)/1000))};requestAnimationFrame(f)})}
$('scan').onclick=async()=>{
 const ua=navigator.userAgent,dpr=window.devicePixelRatio||1;
 const w=Math.round(screen.width*dpr),h=Math.round(screen.height*dpr);
 let os='',brand='',model='';
 const am=ua.match(/Android\s([\d.]+)/);if(am)os='Android '+am[1];
 if(/iPhone/.test(ua)){brand='iPhone';model='iPhone';const im=ua.match(/OS\s(\d+[_\d]*)/);os='iOS '+(im?im[1].replace(/_/g,'.'):'')}
 else{const mm=ua.match(/Android[^;]*;\s([^;)]+?)(?:\sBuild|;|\))/);if(mm){model=mm[1].trim();brand=(model.match(/^(SM-|Galaxy)/i)?'Samsung':(Object.keys(db).find(b=>model.toLowerCase().startsWith(b.toLowerCase()))||model.split(' ')[0]))}}
 try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){const hv=await navigator.userAgentData.getHighEntropyValues(['model','platformVersion']);if(hv.model)model=hv.model;if(hv.platformVersion&&am)os='Android '+hv.platformVersion.split('.')[0]}}catch(e){}
 const raw=await measureHz();const hz=[60,90,120,144].reduce((a,c)=>Math.abs(c-raw)<Math.abs(a-raw)?c:a);
 const size=Math.hypot(screen.width,screen.height)/160;
 const known=Object.entries(db).flatMap(([b,ms])=>ms.map(m=>({b,m})));
 const hit=known.find(k=>model&&k.b===brand&&model.toLowerCase().includes(k.m[0].toLowerCase()));
 dev={brand:brand||dev.brand,model:model||dev.model,hz,tier:hit?hit.m[2]:(hz>=120?2:hz>=90?1:0),w,h,dpr,os,size};
 W('hs_dev',dev);vals=null;render();
};
render();
</script>
</body>
</html>
